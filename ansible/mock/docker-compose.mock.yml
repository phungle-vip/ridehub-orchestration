services:
  vps1-mock:
    build:
      context: .
      dockerfile: Dockerfile.mock-vps
    container_name: vps1-mock
    hostname: vps1-infra
    restart: unless-stopped
    ports:
      - "127.0.0.1:2221:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - /home/phungvip/ridehub:/home/phungvip/ridehub:rw
    networks:
      mock_net:
        ipv4_address: 172.28.0.10

  vps2-mock:
    build:
      context: .
      dockerfile: Dockerfile.mock-vps
    container_name: vps2-mock
    hostname: vps2-microservices
    restart: unless-stopped
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - /home/phungvip/ridehub:/home/phungvip/ridehub:rw
    networks:
      mock_net:
        ipv4_address: 172.28.0.20

networks:
  mock_net:
    name: mock-multi-vps-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

